# Stack dev: Postgres + Redis en localhost (API con `npm run start:dev` en el host).
# Opción "todo en Docker": perfil `full-docker` (servicio `api`).
#
# Variables: pasá `--env-file .env.dev` (copiá desde `.env.dev.example`).
#
#   docker compose --env-file .env.dev -f docker-compose.dev.yml up -d
#
# API opcional en contenedor:
#   docker compose --env-file .env.dev -f docker-compose.dev.yml --profile full-docker up -d
#
# --- Sandbox Docker (contenedores por reto) ---
# El worker de evaluación levanta contenedores postgres:16 adicionales en el host Docker.
# Windows (Docker Desktop): DOCKER_HOST=npipe:////./pipe/docker_engine
# Linux/Mac:                DOCKER_HOST no necesario (socket por defecto)
# Imagen sandbox:           SANDBOX_POSTGRES_IMAGE=postgres:16 (var de entorno en API)
# Memoria sandbox:          512 MB por contenedor (SQL_RUNNER_MEMORY_BYTES=536870912)
# CPU sandbox:              0.5 CPUs (SQL_RUNNER_NANO_CPUS=500000000)
# TTL sandbox por defecto:  SANDBOX_TTL_DAYS (fallback SANDBOX_DEFAULT_TTL_DAYS)=30 desde aprovisionamiento
#
# BullMQ + sandboxes Postgres nombrados:
# - La API/worker en el HOST usa el socket Docker local (Docker Desktop) para `dockerode`.
# - Si corrés la API dentro del contenedor `api`, montá el socket (`/var/run/docker.sock`) y
#   configurá `DOCKER_HOST` / rutas según tu entorno; en Windows/WSL el host suele ser distinto
#   de `127.0.0.1` visto desde el contenedor para puertos mapeados del sandbox.
# - Imagen del sandbox: `SANDBOX_POSTGRES_IMAGE` (default `postgres:16` en código).
# - Bull stalled jobs: `BULL_STALLED_INTERVAL_MS` o `BULLMQ_STALLED_INTERVAL_MS`; locks: `SQL_EVALUATION_LOCK_MS`, `CHALLENGE_SANDBOX_LOCK_MS`.

services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-15-alpine}
    container_name: sqlia-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./.db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    container_name: sqlia-redis-dev
    command:
      - redis-server
      - --appendonly
      - 'no'
      - --maxmemory-policy
      - noeviction
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    profiles:
      - full-docker
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sqlia-api-dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-3000}
      AI_URL: ${AI_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      # Sandbox Docker: montar el socket del host para que el worker pueda crear contenedores.
      # En Windows con Docker Desktop usar npipe; en Linux/Mac el socket Unix.
      DOCKER_HOST: ${DOCKER_HOST:-}
      SANDBOX_POSTGRES_IMAGE: ${SANDBOX_POSTGRES_IMAGE:-postgres:16}
      SQL_SANDBOX_DB_HOST: ${SQL_SANDBOX_DB_HOST:-host.docker.internal}
      SANDBOX_DEFAULT_TTL_DAYS: ${SANDBOX_DEFAULT_TTL_DAYS:-30}
      SANDBOX_TTL_DAYS: ${SANDBOX_TTL_DAYS:-}
      BULLMQ_STALLED_INTERVAL_MS: ${BULLMQ_STALLED_INTERVAL_MS:-45000}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api_node_modules:
